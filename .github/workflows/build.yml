name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ordenar archivos
        run: |
          mkdir -p app/src/main/java/com/cut/editor
          mv app.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv EditorViewModel.kt MainActivity.kt app/src/main/java/com/cut/editor/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceptar licencias Android
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: CutEditor-apk, path: app/build/outputs/apk/debug/app-debug.apk }
